<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-labelledby="title desc">
  <title id="title">Ratatoskr: an agent network</title>
  <desc id="desc">Ratatoskr, the horned squirrel of Norse myth, runs up the world tree Yggdrasil with a message, between the eagle at its crown and the dragon Níðhöggr at its roots. The branches link Claude Code, Codex, pi, OpenCode and other agents over a shared network, and the three roots reach into app development, devops and infrastructure work.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1420"/>
      <stop offset="1" stop-color="#13261f"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#3f8f6b" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#3f8f6b" stop-opacity="0"/>
    </radialGradient>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .branch { fill: none; stroke: #6fae8a; stroke-width: 6; stroke-linecap: round; }
      .root { fill: none; stroke: #4f7d67; stroke-width: 10; stroke-linecap: round; }
      .peer { fill: none; stroke: #f2c14e; stroke-width: 2; stroke-dasharray: 3 7; stroke-linecap: round; opacity: 0.75; }
      .bark { fill: none; stroke: #3c6452; stroke-width: 3; stroke-linecap: round; }
      .pill { fill: #16303a; stroke: #8fd3ae; stroke-width: 2; }
      .pill-open { fill: #0f1c24; stroke: #8fd3ae; stroke-width: 2; stroke-dasharray: 6 6; }
      .agent { fill: #eaf6ef; font-size: 19px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
      .task { fill: #b9d4c6; font-size: 17px; text-anchor: middle; }
      .caption { fill: #7fa593; font-size: 13px; letter-spacing: 0.16em; }
      .packet { fill: #f2c14e; stroke: #0f1c24; stroke-width: 3; }
      .rune { fill: none; stroke: #f2c14e; stroke-width: 3.2; stroke-linecap: round; stroke-linejoin: round; }
      .leaf { fill: #3f8f6b; opacity: 0.55; }
    </style>
    <!-- Elder Futhark runes, drawn as paths so they don't depend on an installed font -->
    <path id="rune-r" class="rune" d="M0 36 L0 0 L18 10 L0 20 L18 36"/>
    <path id="rune-a" class="rune" d="M0 36 L0 0 L16 10 M0 12 L16 22"/>
    <path id="rune-t" class="rune" d="M10 36 L10 0 M0 10 L10 0 L20 10"/>
    <path id="rune-o" class="rune" d="M0 36 L20 12 L10 0 L0 12 L20 36"/>
    <path id="rune-s" class="rune" d="M14 0 L2 16 L16 20 L4 36"/>
    <path id="rune-k" class="rune" d="M16 4 L2 18 L16 32"/>
    <ellipse id="leaf" class="leaf" cx="0" cy="0" rx="11" ry="4.5"/>
  </defs>

  <rect width="1280" height="720" fill="url(#sky)"/>
  <ellipse cx="880" cy="230" rx="450" ry="290" fill="url(#glow)"/>

  <!-- Wordmark, with the name in runes -->
  <g transform="translate(72 212)">
    <use href="#rune-r" x="0"/>
    <use href="#rune-a" x="32"/>
    <use href="#rune-t" x="62"/>
    <use href="#rune-a" x="98"/>
    <use href="#rune-t" x="128"/>
    <use href="#rune-o" x="164"/>
    <use href="#rune-s" x="198"/>
    <use href="#rune-k" x="228"/>
    <use href="#rune-r" x="258"/>
  </g>
  <text class="sans" x="70" y="326" fill="#f4f8f5" font-size="78" font-weight="700" letter-spacing="-1.5">ratatoskr</text>
  <text class="sans" x="72" y="378" fill="#b9d4c6" font-size="25">A network where your agents find</text>
  <text class="sans" x="72" y="412" fill="#b9d4c6" font-size="25">each other and work as a team.</text>

  <!-- Ash leaves -->
  <g>
    <use href="#leaf" transform="translate(735 318) rotate(18)"/>
    <use href="#leaf" transform="translate(690 322) rotate(-16)"/>
    <use href="#leaf" transform="translate(800 312) rotate(32)"/>
    <use href="#leaf" transform="translate(760 262) rotate(-38)"/>
    <use href="#leaf" transform="translate(735 205) rotate(60)"/>
    <use href="#leaf" transform="translate(782 222) rotate(-28)"/>
    <use href="#leaf" transform="translate(838 238) rotate(52)"/>
    <use href="#leaf" transform="translate(865 215) rotate(-50)"/>
    <use href="#leaf" transform="translate(895 215) rotate(50)"/>
    <use href="#leaf" transform="translate(922 238) rotate(-52)"/>
    <use href="#leaf" transform="translate(978 222) rotate(28)"/>
    <use href="#leaf" transform="translate(1025 205) rotate(-60)"/>
    <use href="#leaf" transform="translate(1000 262) rotate(38)"/>
    <use href="#leaf" transform="translate(960 312) rotate(-32)"/>
    <use href="#leaf" transform="translate(1025 318) rotate(-18)"/>
    <use href="#leaf" transform="translate(1070 322) rotate(16)"/>
  </g>

  <!-- Peer-to-peer links between agents -->
  <path class="peer" d="M660 232 Q672 190 690 164"/>
  <path class="peer" d="M775 146 Q802 150 828 162"/>
  <path class="peer" d="M932 162 Q958 150 985 146"/>
  <path class="peer" d="M1070 164 Q1088 190 1100 232"/>

  <!-- Branches: the shared network -->
  <path class="branch" d="M880 340 C860 275 690 310 625 277"/>
  <path class="branch" d="M880 340 C870 250 740 220 715 162"/>
  <path class="branch" d="M880 340 L880 106"/>
  <path class="branch" d="M880 340 C890 250 1020 220 1045 162"/>
  <path class="branch" d="M880 340 C900 275 1070 310 1135 277"/>

  <!-- The three roots: the work -->
  <path class="root" d="M848 558 C820 610 750 590 690 640"/>
  <path class="root" d="M880 565 L880 650"/>
  <path class="root" d="M912 558 C940 610 1010 590 1072 640"/>

  <!-- Trunk of Yggdrasil -->
  <path d="M832 572 C850 500 856 420 868 342 C872 326 888 326 892 342 C904 420 910 500 928 572 Q880 586 832 572 Z" fill="#5d9478"/>
  <path class="bark" d="M870 365 C868 420 866 470 856 530"/>
  <path class="bark" d="M884 400 C884 450 884 500 880 548"/>
  <path class="bark" d="M895 372 C896 410 897 440 900 470"/>

  <!-- Messages in transit -->
  <circle class="packet" cx="769.4" cy="296.5" r="8"/>
  <circle class="packet" cx="803.1" cy="239" r="8"/>
  <circle class="packet" cx="880" cy="262" r="8"/>
  <circle class="packet" cx="956.9" cy="239" r="8"/>
  <circle class="packet" cx="990.6" cy="296.5" r="8"/>

  <!-- Agents -->
  <g class="sans">
    <rect class="pill" x="545" y="233" width="160" height="44" rx="22"/>
    <text class="agent" x="625" y="255">Claude Code</text>
    <rect class="pill" x="655" y="118" width="120" height="44" rx="22"/>
    <text class="agent" x="715" y="140">Codex</text>
    <rect class="pill" x="830" y="148" width="100" height="44" rx="22"/>
    <text class="agent" x="880" y="170">pi</text>
    <rect class="pill" x="985" y="118" width="120" height="44" rx="22"/>
    <text class="agent" x="1045" y="140">OpenCode</text>
    <rect class="pill-open" x="1055" y="233" width="160" height="44" rx="22"/>
    <text class="agent" x="1135" y="255">+ your agent</text>
  </g>

  <!-- The eagle at the crown -->
  <g>
    <path id="wing" d="M872 70 C850 38 815 24 785 30 L798 46 L790 50 L808 62 L802 68 L822 74 L820 82 L846 82 L862 90 Z" fill="#c9b48a"/>
    <path d="M888 70 C910 38 945 24 975 30 L962 46 L970 50 L952 62 L958 68 L938 74 L940 82 L914 82 L898 90 Z" fill="#c9b48a"/>
    <path d="M869 102 L880 126 L891 102 Z" fill="#8f7a52"/>
    <ellipse cx="880" cy="80" rx="16" ry="27" fill="#8f7a52"/>
    <circle cx="880" cy="46" r="12" fill="#f4f0e4"/>
    <path d="M871 42 C862 42 857 49 859 57 C863 52 868 52 873 52 Z" fill="#f2c14e"/>
    <circle cx="876" cy="43" r="2.2" fill="#1a0d05"/>
  </g>

  <!-- Níðhöggr, gnawing at the root -->
  <g>
    <path d="M928 626 C945 660 975 660 995 636 C1010 616 1040 616 1050 594 C1055 582 1048 572 1038 570" fill="none" stroke="#a8443f" stroke-width="16" stroke-linecap="round"/>
    <path d="M928 626 C945 660 975 660 995 636 C1010 616 1040 616 1050 594 C1055 582 1048 572 1038 570" fill="none" stroke="#e08a6b" stroke-width="3" stroke-dasharray="2 10" stroke-linecap="round"/>
    <g transform="translate(910 624)">
      <path d="M12 -14 C20 -26 32 -30 42 -28 C32 -22 26 -14 22 -10 Z" fill="#e9dcc0"/>
      <path d="M28 -7 C14 -20 -6 -18 -26 -8 L-16 -2 L-8 -6 L6 0 L28 7 Z" fill="#a8443f"/>
      <path d="M28 7 C10 13 -6 14 -22 10 L-10 5 L6 3 Z" fill="#8a3330"/>
      <path d="M-20 -5 L-17 2 L-13 -3 L-10 3 L-6 -4 Z" fill="#f4f0e4"/>
      <circle cx="5" cy="-10" r="2.6" fill="#f2c14e"/>
    </g>
  </g>

  <!-- Work the teams take on -->
  <g class="mono">
    <text class="task" x="680" y="668">app development</text>
    <text class="task" x="880" y="680">devops</text>
    <text class="task" x="1082" y="668">infrastructure</text>
  </g>

  <!-- Ratatoskr, horned, running up the trunk with a message in its mouth -->
  <g transform="translate(912 470) rotate(90) scale(1.25)">
    <path d="M34 -12 C66 -16 84 -46 66 -74 C52 -96 16 -98 2 -80 C18 -80 30 -70 30 -56 C30 -44 22 -36 12 -30 Z" fill="#d9773a"/>
    <path d="M46 -22 C64 -30 74 -50 62 -70 C52 -86 32 -91 18 -86 C34 -82 44 -70 42 -54 C41 -42 36 -32 30 -26 Z" fill="#b65a26"/>
    <ellipse cx="2" cy="-18" rx="30" ry="18" fill="#c8622e"/>
    <ellipse cx="-2" cy="-8" rx="24" ry="7" fill="#f0c9a3"/>
    <ellipse cx="20" cy="-16" rx="17" ry="16" fill="#b65a26"/>
    <path d="M12 -5 L34 2" stroke="#8f4519" stroke-width="7" stroke-linecap="round"/>
    <path d="M-16 -8 L-26 3" stroke="#8f4519" stroke-width="6" stroke-linecap="round"/>
    <path d="M-29 -37 C-30 -46 -26 -49 -22 -48 C-19 -44 -19 -38 -21 -34 Z" fill="#b65a26"/>
    <ellipse cx="-36" cy="-26" rx="16" ry="13" fill="#c8622e"/>
    <ellipse cx="-49" cy="-22" rx="9" ry="7" fill="#f0c9a3"/>
    <path d="M-40 -37 C-47 -42 -55 -46 -65 -47 C-58 -41 -52 -36 -47 -32 Z" fill="#f4f0e4"/>
    <circle cx="-39" cy="-30" r="2.5" fill="#1a0d05"/>
    <g transform="rotate(-90 -62 -21)">
      <rect x="-74" y="-29" width="24" height="16" rx="2" fill="#f4f8f5"/>
      <path d="M-74 -28 L-62 -20 L-50 -28" fill="none" stroke="#c9a23c" stroke-width="2" stroke-linejoin="round"/>
    </g>
  </g>

  <!-- Layer captions -->
  <g class="sans caption">
    <text x="1215" y="70" text-anchor="end">AGENTS</text>
    <text x="838" y="460" text-anchor="end">NETWORK</text>
    <text x="1215" y="610" text-anchor="end">SHARED WORK</text>
  </g>
</svg>
